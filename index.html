<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f2f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OKTA777</title>
<style>
/* =========================================================
   STYLE  —  semua ukuran memakai var(--u) = 1% lebar layar
   ========================================================= */
:root{--u:3.9px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#050505;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;color:#111;-webkit-font-smoothing:antialiased}
#stage{position:fixed;left:50%;top:0;height:100vh;height:100dvh;width:min(100vw,calc(100vh*.5625));width:min(100vw,calc(100dvh*.5625));transform:translateX(-50%);overflow:hidden;background:#f3f2f0}
#cam{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.scene{position:absolute;inset:0;overflow:hidden;display:none;pointer-events:none}
.av{width:100%;height:100%}
.av svg,.av img{width:100%;height:100%;display:block}
.av img{object-fit:contain;object-position:center bottom}
.p-av img,.mini img,.p-img img,.ph img{object-fit:cover;object-position:45% 40%}
.hw{will-change:transform,opacity}

/* Story Progress Bar di atas layar */
#storyBar{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);top:calc(env(safe-area-inset-top) + var(--u)*2.2);height:calc(var(--u)*.65);border-radius:99px;background:rgba(130,130,140,.28);overflow:hidden;z-index:95;pointer-events:none}
#storyFill{width:0%;height:100%;background:rgba(255,255,255,.92);box-shadow:0 0 calc(var(--u)*1.2) rgba(0,0,0,.25);border-radius:99px}

/* Cinematic Edge Vignette & Beat Flash */
#vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 52%,rgba(10,8,25,.48) 100%);opacity:0;pointer-events:none;z-index:82;transition:opacity .25s ease}
#beatFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:85;mix-blend-mode:overlay}

/* Jejak Cahaya Sentuhan HP */
#touchTrail{position:absolute;inset:0;pointer-events:none;z-index:92;overflow:hidden}
#touchTrail i{position:absolute;width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);margin:calc(var(--u)*-1.6) 0 0 calc(var(--u)*-1.6);border-radius:50%;background:radial-gradient(circle,#fff 0,#ffd27d 45%,rgba(255,160,60,0) 75%);pointer-events:none;animation:sparkFade .55s ease-out forwards}
@keyframes sparkFade{0%{transform:scale(.4);opacity:.95}100%{transform:scale(2.1);opacity:0}}

/* ---------- S1 : I HIT IT / FAST + Kinetic Tracking ---------- */
#s1{background:linear-gradient(150deg,#5a2ee0 0%,#7a4bf7 55%,#9566ff 100%)}
#s1 .orb{position:absolute;left:calc(var(--u)*-26);bottom:calc(var(--u)*-22);width:calc(var(--u)*96);height:calc(var(--u)*96);border-radius:50%;background:radial-gradient(circle at 35% 30%,#cdb9ff,#8c5cff 60%,#6a3bea)}
#s1 .band{position:absolute;left:0;right:0;top:calc(50% - var(--u)*40);height:calc(var(--u)*62);background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,0))}
#s1 .slines{position:absolute;inset:0;opacity:0}
#s1 .slines i{position:absolute;right:0;height:calc(var(--u)*.55);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.8));border-radius:99px}
.bw{position:absolute;color:#fff;font-weight:900;line-height:.85;letter-spacing:-.045em;white-space:nowrap;text-shadow:0 calc(var(--u)*1.2) calc(var(--u)*3.5) rgba(35,10,110,.35)}
#s1 .t1{left:calc(var(--u)*8);top:calc(50% - var(--u)*22);font-size:calc(var(--u)*21)}
#s1 .t2{left:calc(var(--u)*3);top:calc(50% - var(--u)*26);font-size:calc(var(--u)*52);transform-origin:15% 50%}

/* ---------- S2 : Elastic Card Pop & Camera Shutter ---------- */
#s2{background:#efeef5}
#s2 .rays{position:absolute;left:50%;top:50%;width:calc(var(--u)*320);height:calc(var(--u)*320);margin:calc(var(--u)*-160) 0 0 calc(var(--u)*-160);background:repeating-conic-gradient(from 0deg,#fff 0 6deg,#9e96c7 6deg 12deg)}
#s2 .fw{position:absolute;left:50%;top:50%;width:calc(var(--u)*92);height:calc(var(--u)*92);margin:calc(var(--u)*-46) 0 0 calc(var(--u)*-46);border-radius:calc(var(--u)*5);padding:calc(var(--u)*1.5);background:#fff;box-shadow:0 calc(var(--u)*3) calc(var(--u)*8) rgba(30,20,70,.28);will-change:transform,opacity}
#s2 .fw .inner{width:100%;height:100%;border-radius:calc(var(--u)*3.8);overflow:hidden;background:#18181c}
#s2 .fw img{object-fit:cover;object-position:45% 42%}
#s2 .shutter{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* ---------- S3 : post Instagram + Double-Tap Heart Burst ---------- */
#s3{background:#fff}
#post{position:absolute;left:0;top:0;width:calc(var(--u)*100);transform-origin:0 0;background:#fff;color:#111}
.p-head{height:calc(var(--u)*14);display:flex;align-items:center;padding:0 calc(var(--u)*3.5);gap:calc(var(--u)*2.5);font-size:calc(var(--u)*3.7);font-weight:600}
.p-head .dots{margin-left:auto;letter-spacing:.1em;font-weight:700}
.p-av{display:block;width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:50%;padding:calc(var(--u)*.6);background:conic-gradient(#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75)}
.p-av span{display:block;width:100%;height:100%;border-radius:50%;border:calc(var(--u)*.6) solid #fff;background:#e9e2ff;overflow:hidden}
.p-img{position:relative;height:calc(var(--u)*100);overflow:hidden;background:#18181c}
.p-img .big{position:absolute;inset:0;width:100%;height:100%}
.p-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,60,120,.12),rgba(255,120,40,.1));pointer-events:none}
#bigHeart{position:absolute;left:50%;top:50%;width:calc(var(--u)*26);height:calc(var(--u)*26);margin:calc(var(--u)*-13) 0 0 calc(var(--u)*-13);fill:#fff;filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*3.5) rgba(0,0,0,.35));opacity:0;transform:scale(0);z-index:4;pointer-events:none}
#floatHearts{position:absolute;left:calc(var(--u)*6.8);top:calc(var(--u)*115);width:0;height:0;pointer-events:none;z-index:5}
#floatHearts svg{position:absolute;width:calc(var(--u)*4.2);height:calc(var(--u)*4.2);fill:#ff3040;opacity:0}
.p-act{height:calc(var(--u)*12);display:flex;align-items:center;padding:0 calc(var(--u)*3.5);gap:calc(var(--u)*4)}
.p-act svg{width:calc(var(--u)*6.6);height:calc(var(--u)*6.6);fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;transform-origin:50% 50%}
.p-act svg.liked{fill:#ff3040;stroke:#ff3040}
.p-act svg:last-child{margin-left:auto}
.p-line{height:calc(var(--u)*8);display:flex;align-items:center;gap:calc(var(--u)*1.6);padding:0 calc(var(--u)*3.5);font-size:calc(var(--u)*3.7);white-space:nowrap}
.p-line .mini{width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:50%;overflow:hidden;background:#d8d1ff;flex:none}
.p-meta{padding:0 calc(var(--u)*3.5);font-size:calc(var(--u)*3.4);color:#8e8e93;line-height:1.9}

/* ---------- S4 : kalender ---------- */
#s4{background:#f5f5f6}
#s4 .grid{position:absolute;left:0;top:0;transform-origin:0 0}
.cell{position:absolute;width:calc(var(--u)*24);height:calc(var(--u)*24);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*7);font-weight:600;color:#9b9ba1}
.today{position:absolute;width:calc(var(--u)*24);height:calc(var(--u)*24);display:flex;align-items:center;justify-content:center}
.today b{display:flex;align-items:center;justify-content:center;width:calc(var(--u)*15);height:calc(var(--u)*15);border-radius:50%;background:#ff3b30;color:#fff;font-size:calc(var(--u)*7.6);font-weight:600}

/* ---------- S5 : cutout + sunburst ---------- */
#s5 .wash{position:absolute;inset:0;background:#fff;opacity:0}
#s5 .card{position:absolute;left:0;top:50%;width:calc(var(--u)*100);height:calc(var(--u)*108);margin-top:calc(var(--u)*-54);transform-origin:50% 50%;background:rgba(255,255,255,0)}
#s5 .burst{position:absolute;left:0;top:calc(var(--u)*2);width:calc(var(--u)*100);height:calc(var(--u)*100);opacity:0}
#s5 .pers{position:absolute;left:calc(var(--u)*-7);bottom:calc(var(--u)*-5);width:calc(var(--u)*114);height:calc(var(--u)*128)}
#s5 .streak{position:absolute;right:0;top:calc(var(--u)*56);height:calc(var(--u)*.7);width:0;background:#ff8a1a}
#s5 .badge{position:absolute;right:calc(var(--u)*3);bottom:calc(var(--u)*3);background:#111;color:#fff;font-size:calc(var(--u)*2.1);font-weight:800;line-height:1.15;text-align:center;padding:calc(var(--u)*1) calc(var(--u)*1.6);letter-spacing:.04em;opacity:0}
#s5 .capWrap{position:absolute;left:0;right:0;top:calc(50% + var(--u)*37.5);display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);opacity:0}
#s5 .cap20{font-size:calc(var(--u)*3.3);font-weight:700;color:#6e6e73}
.eq{display:flex;align-items:flex-end;gap:calc(var(--u)*.6);height:calc(var(--u)*3.2)}
.eq i{display:block;width:calc(var(--u)*.65);height:40%;background:#ff8a00;border-radius:99px}

/* ---------- S6 : warm dreamy bokeh + karaoke lyric spotlight ---------- */
#s6{background:#f5efe8}
#s6 .bk{position:absolute;inset:0;will-change:transform}
.bk i{position:absolute;display:block;border-radius:50%}
.bk .or{left:calc(var(--u)*-10);top:calc(var(--u)*-34);width:calc(var(--u)*120);height:calc(var(--u)*100);background:radial-gradient(ellipse at 50% 45%,#ffa21c 0,#ffb94a 38%,rgba(255,200,120,0) 72%)}
.bk .w1{left:calc(var(--u)*-26);top:calc(50% - var(--u)*32);width:calc(var(--u)*82);height:calc(var(--u)*82);background:radial-gradient(circle,#ffbe55 0,rgba(255,190,85,0) 70%)}
.bk .w2{left:calc(var(--u)*48);top:calc(50% - var(--u)*38);width:calc(var(--u)*82);height:calc(var(--u)*82);background:radial-gradient(circle,#ff9b7a 0,rgba(255,155,122,0) 70%)}
.bk .dot{left:calc(var(--u)*72);top:calc(50% - var(--u)*14);width:calc(var(--u)*30);height:calc(var(--u)*30);background:radial-gradient(circle,#ff9a1a 0,#ff9a1a 38%,rgba(255,154,26,0) 72%)}
.bk .pk1{left:calc(var(--u)*-10);bottom:calc(var(--u)*-14);width:calc(var(--u)*80);height:calc(var(--u)*70);background:radial-gradient(circle,#ff8fa6 0,rgba(255,143,166,0) 70%)}
.bk .pk2{right:calc(var(--u)*-16);bottom:calc(var(--u)*-6);width:calc(var(--u)*80);height:calc(var(--u)*70);background:radial-gradient(circle,#ffa38f 0,rgba(255,163,143,0) 70%)}
.bk .gy{left:calc(var(--u)*20);bottom:calc(var(--u)*18);width:calc(var(--u)*44);height:calc(var(--u)*36);background:radial-gradient(circle,rgba(140,125,120,.45) 0,rgba(140,125,120,0) 70%)}
#s6 .sparkles{position:absolute;inset:0;pointer-events:none}
#s6 .sparkles span{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,0) 70%);box-shadow:0 0 calc(var(--u)*2) rgba(255,255,255,.8)}
.ly{position:absolute;left:calc(var(--u)*7);top:calc(50% - var(--u)*11);font-size:calc(var(--u)*10.2);font-weight:700;color:#fff;letter-spacing:-.025em;line-height:1.16;white-space:nowrap;opacity:0}
.ly .w{display:inline-block;margin-right:.26em;opacity:0;transform-origin:50% 65%;will-change:transform,opacity,filter}
#s6 .sweep{position:absolute;left:0;top:calc(50% - var(--u)*1);width:100%;height:calc(var(--u)*5);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95) 40%,rgba(255,255,255,0));opacity:0}
#s6 .bigw{position:absolute;left:0;right:0;top:calc(50% - var(--u)*14);text-align:center;font-size:calc(var(--u)*22.5);font-weight:900;letter-spacing:-.045em;line-height:1;white-space:nowrap;opacity:0;background:linear-gradient(105deg,#ffffff 15%,#fff2c2 45%,#ffffff 65%,#ffd88a 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 calc(var(--u)*1.2) calc(var(--u)*3.5) rgba(160,70,5,.42));animation:shimmerTxt 2.2s linear infinite}
@keyframes shimmerTxt{0%{background-position:120% 0}100%{background-position:-100% 0}}

/* ---------- S7 : 3 kartu ponsel (3D perspective) + stamp label ---------- */
#s7{background:radial-gradient(circle at 50% 45%,#fff 0,#efefef 100%);perspective:calc(var(--u)*220)}
#s7 .zoomer{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.ph{position:absolute;left:calc(var(--u)*-15);top:calc(var(--u)*-27);width:calc(var(--u)*30);height:calc(var(--u)*54);border-radius:calc(var(--u)*4);background:#111;padding:calc(var(--u)*.9);box-shadow:0 calc(var(--u)*2.5) calc(var(--u)*6) rgba(0,0,0,.28);backface-visibility:hidden}
.ph .in{width:100%;height:100%;border-radius:calc(var(--u)*3.2);overflow:hidden;position:relative}
.ph .in .av{position:absolute;inset:0;width:100%;height:100%}
.lab{position:absolute;background:#e63946;color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;line-height:1;padding:calc(var(--u)*1) calc(var(--u)*2);white-space:nowrap;transform-origin:50% 50%;opacity:0;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(230,57,70,.35)}
#s7 .wo{position:absolute;inset:0;background:#fff;opacity:0}

/* ---------- S8 : kartu jatuh ---------- */
#s8{background:#fff}
#s8 .fall{position:absolute;left:calc(50% - var(--u)*11);top:calc(50% - var(--u)*20);width:calc(var(--u)*22);height:calc(var(--u)*40);border-radius:calc(var(--u)*3);background:#1b1b1f;box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.25)}

/* ---------- S9 / S10 : grayscale + film grain + dreamy bloom ---------- */
#s9,#s10{background:linear-gradient(180deg,#f2f2f4,#d8d8dc)}
.pp{position:absolute;filter:grayscale(1) contrast(.98) brightness(1.06)}
#s9 .pp{left:calc(var(--u)*-8);bottom:0;width:calc(var(--u)*100);height:calc(var(--u)*130)}
#s10 .pp{left:calc(var(--u)*-17);bottom:calc(var(--u)*-8);width:calc(var(--u)*134);height:calc(var(--u)*170)}
.haze{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,0) 60%)}
.grain{position:absolute;inset:-20%;background-image:radial-gradient(rgba(0,0,0,.09) 1px,transparent 0);background-size:calc(var(--u)*1.1) calc(var(--u)*1.1);opacity:.55;pointer-events:none}
.sticker{position:absolute;color:#fff;font-weight:900;letter-spacing:-.04em;line-height:.88;text-shadow:0 0 calc(var(--u)*.4) #555,calc(var(--u)*.7) calc(var(--u)*.7) 0 #8c8c90}
#s9 .tx{right:calc(var(--u)*4);bottom:calc(var(--u)*32);text-align:right;font-size:calc(var(--u)*16)}
#s10 .bloom{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.85),rgba(255,255,255,0) 65%);opacity:0;pointer-events:none}
#s10 .fin{left:calc(var(--u)*5);bottom:calc(var(--u)*22);font-size:calc(var(--u)*13);font-style:italic;color:#111;transform:rotate(-3deg);transform-origin:0 100%;-webkit-text-stroke:calc(var(--u)*1.1) #fff;paint-order:stroke fill;text-shadow:none}
#s10 .finbig{left:0;right:0;bottom:calc(var(--u)*5);text-align:center;font-size:calc(var(--u)*24);color:#dcdcdc;text-shadow:calc(var(--u)*-.5) calc(var(--u)*-.5) 0 #fff,calc(var(--u)*.8) calc(var(--u)*.8) calc(var(--u)*1) rgba(0,0,0,.28);opacity:0}

/* ---------- S11 : akhir (hitam) + interactive glow + tombol ---------- */
#s11{background:#000}
#s11 .glow{position:absolute;left:50%;top:50%;width:calc(var(--u)*115);height:calc(var(--u)*115);margin:calc(var(--u)*-57.5) 0 0 calc(var(--u)*-57.5);border-radius:50%;background:radial-gradient(circle,rgba(255,155,40,.32) 0,rgba(130,80,255,.16) 45%,rgba(0,0,0,0) 72%);pointer-events:none;transition:transform .18s ease-out}
#s11 .end{position:absolute;left:0;right:0;bottom:0;padding:0 calc(var(--u)*6) calc(env(safe-area-inset-bottom) + var(--u)*12);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3.5);opacity:0}
#s11 .end>*{pointer-events:inherit}
.btn{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;text-decoration:none;font:inherit;font-weight:700;font-size:calc(var(--u)*4);color:#fff;padding:calc(var(--u)*3.4) calc(var(--u)*8);border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);min-width:calc(var(--u)*48);text-align:center}
.btn.main{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 calc(var(--u)*5) rgba(255,255,255,.28)}
.btn:active{transform:scale(.97)}

/* ikon pause & tombol tap mulai suara */
#pauseIcon{position:absolute;left:50%;top:50%;width:calc(var(--u)*16);height:calc(var(--u)*16);margin:calc(var(--u)*-8) 0 0 calc(var(--u)*-8);border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#pauseIcon svg{width:45%;height:45%;fill:#fff}
#tapStart{position:absolute;inset:0;z-index:120;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#tapStart span{background:#fff;color:#000;font-weight:800;font-size:calc(var(--u)*4.2);padding:calc(var(--u)*3.2) calc(var(--u)*7);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
</style>
</head>
<body>

<audio id="bgm" preload="auto" playsinline></audio>

<div id="stage">
  <div id="storyBar"><div id="storyFill"></div></div>

  <div id="cam">

    <!-- S1 -->
    <section class="scene" id="s1">
      <div class="band"></div><div class="orb"></div>
      <div class="slines" id="slines"></div>
      <div class="bw t1 hw" id="t1"></div>
      <div class="bw t2 hw" id="t2"></div>
    </section>

    <!-- S2 : Elastic Card Pop & Camera Shutter -->
    <section class="scene" id="s2">
      <div class="rays hw" id="rays"></div>
      <div class="fw" id="fw"><div class="inner av" data-av="shock"></div></div>
      <div class="shutter" id="shutter"></div>
    </section>

    <!-- S3 : Instagram + Auto Double-Tap Heart Burst -->
    <section class="scene" id="s3">
      <div id="post" class="hw">
        <div class="p-head"><i class="p-av"><span data-av="cap" class="av"></span></i><b data-user></b><span class="dots">•••</span></div>
        <div class="p-img">
          <div class="big av" data-av="shock"></div>
          <svg id="bigHeart" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </div>
        <div id="floatHearts"></div>
        <div class="p-act">
          <svg id="likeHeart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5 6.3 5c2 0 3.7 1.2 4.7 2.8h2C14 6.2 15.7 5 17.7 5 21 5 22.8 8.6 21.5 11.8 19.5 16.4 12 21 12 21z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.5L3 20.5l1.6-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M22 3 2 10.5l7.5 3L12.5 21zM22 3 9.5 13.5"/></svg>
          <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
        </div>
        <div class="p-line"><span class="mini av" data-av="helmet"></span><span>Liked by <b id="likedBy"></b> and <b id="likes"></b> others</span></div>
        <div class="p-line"><span><b data-user></b> <span id="caption"></span></span></div>
        <div class="p-meta">View all <span id="comments"></span> comments<br>2 hours ago</div>
      </div>
    </section>

    <!-- S4 -->
    <section class="scene" id="s4">
      <div class="grid hw" id="grid"><div id="cells"></div><div id="todayWrap"></div></div>
    </section>

    <!-- S6 (di bawah S5 agar kartu menyusut di atas bokeh hangat) -->

/* Deteksi otomatis ekstensi & huruf kapital agar gambar selalu ketemu */
function getCandidates(base){
  if(!base) return [];
  const clean=base.replace(/\.(png|jpg|jpeg|webp)$/i,"");
  const cap=clean.charAt(0).toUpperCase()+clean.slice(1);
  const low=clean.toLowerCase();
  const exts=["PNG","png","JPG","jpg","jpeg","JPEG","webp"];
  const list=[base];
  [clean,cap,low].forEach(n=>exts.forEach(e=>list.push(`${n}.${e}`)));
  return [...new Set(list)];
}
function nextAv(img,k){
  const list=getCandidates(CFG.IMAGES[k]);
  const idx=parseInt(img.dataset.idx||"0",10)+1;
  if(idx<list.length){
    img.dataset.idx=idx;
    img.src=list[idx];
  }else{
    img.outerHTML=personSVG(PEOPLE[k]);
  }
}
function avatar(k){
  const list=getCandidates(CFG.IMAGES[k]);
  return list.length?`<img src="${list[0]}" data-idx="0" alt="" onerror="nextAv(this,'${k}')">`:personSVG(PEOPLE[k]);

/* ---------- REAL-TIME WEB AUDIO ANALYSER ---------- */
const bgm=$("#bgm");
let audioCtx=null,analyser=null,freqData=null,bassLevel=0,midLevel=0,highLevel=0;
function initWebAudio(){
  if(audioCtx || !CFG.AUDIO) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    audioCtx=new AC();
    const src=audioCtx.createMediaElementSource(bgm);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=128;
    analyser.smoothingTimeConstant=0.78;
    src.connect(analyser);
    analyser.connect(audioCtx.destination);
    freqData=new Uint8Array(analyser.frequencyBinCount);
  }catch(e){
    analyser=null;
  }
}
function sampleAudio(T){
  if(analyser && freqData && !bgm.paused){
    analyser.getByteFrequencyData(freqData);
    let b=0,m=0,h=0;
    for(let i=0;i<5;i++) b+=freqData[i];
    for(let i=5;i<16;i++) m+=freqData[i];
    for(let i=16;i<32;i++) h+=freqData[i];
    bassLevel=(b/(5*255));
    midLevel=(m/(11*255));
    highLevel=(h/(16*255));
  }else{
    bassLevel=0.45+0.45*Math.abs(Math.sin(T*8.5));
    midLevel=0.4+0.5*Math.abs(Math.sin(T*13.2+1.1));
    highLevel=0.35+0.55*Math.abs(Math.cos(T*17.5));
  }
}

/* ---------- GYROSCOPE TILT PARALLAX (SENSOR HP) ---------- */
let tiltX=0,tiltY=0,gyroActive=false;
function onDeviceOrientation(e){
  if(e.gamma===null || e.beta===null) return;
  gyroActive=true;
  const tx=clamp(e.gamma/25,-1,1);
  const ty=clamp((e.beta-45)/25,-1,1);
  tiltX=lerp(tiltX,tx,0.18);
  tiltY=lerp(tiltY,ty,0.18);
}
function enableGyro(){
  if(typeof DeviceOrientationEvent!=="undefined" && typeof DeviceOrientationEvent.requestPermission==="function"){
    DeviceOrientationEvent.requestPermission().then(res=>{
      if(res==="granted") window.addEventListener("deviceorientation",onDeviceOrientation);
    }).catch(()=>{});
  }else if("ondeviceorientation" in window){
    window.addEventListener("deviceorientation",onDeviceOrientation);
  }
}

/* ---------- TOUCH SPARKLE TRAIL & LYRIC TOUCH RIPPLE ---------- */
const trailHost=$("#touchTrail");
let lastSpark=0;
function triggerLyricRipple(clientX,clientY){
  if(T<5.6 || T>9.4) return;
  for(const item of ALL_WORDS){
    const rect=item.el.getBoundingClientRect();
    if(!rect.width) continue;
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const dist=Math.hypot(clientX-cx,clientY-cy);
    if(dist<U*18){
      item.rip=Math.max(item.rip,1-dist/(U*18));
    }
  }
}
function handleTouchFX(e){
  const pt=e.touches?e.touches[0]:e;
  if(!pt) return;
  triggerLyricRipple(pt.clientX,pt.clientY);
  const now=performance.now();
  if(now-lastSpark<35) return;
  lastSpark=now;
  const r=stage.getBoundingClientRect();
  const x=pt.clientX-r.left,y=pt.clientY-r.top;
  if(x<0||y<0||x>r.width||y>r.height) return;
  const dot=document.createElement("i");
  dot.style.left=x+"px";dot.style.top=y+"px";
  trailHost.appendChild(dot);
  setTimeout(()=>dot.remove(),560);
}
stage.addEventListener("pointerdown",handleTouchFX);
stage.addEventListener("pointermove",e=>{if(e.buttons) handleTouchFX(e);});
stage.addEventListener("touchmove",handleTouchFX,{passive:true});

/* ---------- EFEK KAMERA, VIGNETTE, HAPTIC & BEAT GLOBAL ---------- */
const BEATS=[0.62,1.50,4.45,8.80,9.30,11.25,12.85];
let lastVibIdx=-1;
function updateBeatFX(T){
  sampleAudio(T);
  $("#storyFill").style.width=clamp(T/END_TIME)*100+"%";

  const vigOn=(T<1.52)||(T>=5.4 && T<9.42);
  $("#vignette").style.opacity=vigOn?"1":"0";

  let pulse=0,hitIdx=-1;
  for(let i=0;i<BEATS.length;i++){
    const b=BEATS[i];
    if(T>=b && T<b+0.28){
      const p=1-(T-b)/0.28;
      pulse=Math.max(pulse,p*p);
      hitIdx=i;
    }
  }
  if(hitIdx!==-1 && hitIdx!==lastVibIdx && playing && !ended){
    lastVibIdx=hitIdx;
    if(navigator.vibrate) try{navigator.vibrate(14);}catch(e){}
  }else if(hitIdx===-1){
    lastVibIdx=-1;
  }

  const rtBoost=Math.max(0,(bassLevel-0.68)*1.4);
  const totalPulse=clamp(pulse+rtBoost*0.45,0,1.2);
  const cam=$("#cam"),fl=$("#beatFlash");
  if(totalPulse>0.02){
    const sc=1+totalPulse*0.026;
    const dx=(rnd(Math.floor(T*60))-0.5)*1.05*U*pulse;
    const dy=(rnd(Math.floor(T*60)+7)-0.5)*1.05*U*pulse;
    cam.style.transform=`translate3d(${dx.toFixed(1)}px,${dy.toFixed(1)}px,0) scale(${sc.toFixed(4)})`;
    fl.style.opacity=(pulse*0.28).toFixed(2);
  }else{
    cam.style.transform="translate3d(0,0,0) scale(1)";
    fl.style.opacity="0";
  }
}

/* ---------- SCENE FUNCTIONS ---------- */
function s1(t){
  const a=eo(prog(t,0,.4)),out=eio(prog(t,.55,.95)),b=eoq(prog(t,.6,1.12));
  const t1=$("#t1"),t2=$("#t2"),sl=$("#slines");
  t1.style.transform=`translate3d(${(tiltX*3)*U}px,${((1-a)*20-out*26+tiltY*2)*U}px,0)`;t1.style.opacity=a*(1-out);
  /* Kinetic letter-spacing expand lalu mengunci rapat pada beat */
  const ls=lerp(0.18,-0.045,eo(prog(t,.62,1.02)));
  t2.style.letterSpacing=ls.toFixed(3)+"em";
  t2.style.transform=`translate3d(${((1-b)*105+tiltX*4)*U}px,${(tiltY*2.5)*U}px,0) scale(${1+prog(t,1.1,1.55)*.12})`;
  t2.style.opacity=b>0?1:0;
  const sp=prog(t,.62,1.35);
  sl.style.opacity=Math.sin(Math.PI*sp)*0.85;
  sl.style.transform=`translateX(${lerp(20,-45,sp)}%)`;
}
function s2(t){
  $("#rays").style.transform=`translate(${(tiltX*5)*U}px,${(tiltY*5)*U}px) rotate(${t*55}deg)`;
  const pop=eb(prog(t,0,.28));
  const zoomOut=eio(prog(t,.34,.55));
  const sc=lerp(0.55,1.02,pop)+zoomOut*0.24;
  const rot=lerp(-8,3,eo(prog(t,0,.45)))*(1-zoomOut)+tiltX*4;
  const fw=$("#fw");
  fw.style.transform=`translate3d(${(tiltX*-3)*U}px,${(tiltY*-3)*U}px,0) scale(${sc.toFixed(3)}) rotate(${rot.toFixed(2)}deg)`;
  fw.style.opacity=1-prog(t,.44,.55);
  $("#shutter").style.opacity=Math.max(0,1-prog(t,0,.18))*0.85;
}
const CAM=[[0,46,66,1.85],[.5,46,74,1.65],[.95,26,126,2.05],[1.6,26,128,2.05]];
function s3(t){
  let cx=CAM[3][1],cy=CAM[3][2],s=CAM[3][3];
  for(let i=0;i<3;i++){if(t<=CAM[i+1][0]){const A=CAM[i],B=CAM[i+1],p=eq(prog(t,A[0],B[0]));cx=lerp(A[1],B[1],p);cy=lerp(A[2],B[2],p);s=lerp(A[3],B[3],p);break;}}
  const post=$("#post");
  post.style.transform=`translate3d(${W/2-cx*U*s}px,${H/2-cy*U*s}px,0) scale(${s})`;
  const ex=prog(t,1.2,1.55),blur=Math.max(2.4*Math.sin(Math.PI*prog(t,.45,.95)),ex*10);
  post.style.filter=blur>.3?`blur(${blur.toFixed(1)}px)`:"none";
  post.style.opacity=1-ex;

  const bh=$("#bigHeart");
  const hpIn=eb(prog(t,0.25,0.48));
  const hpOut=prog(t,0.68,0.88);
  bh.style.opacity=clamp(prog(t,0.25,0.34))*(1-hpOut)*0.94;
  bh.style.transform=`scale(${(hpIn*(1+hpOut*0.25)).toFixed(3)})`;

  const lh=$("#likeHeart");
  if(t>=0.72){
    lh.classList.add("liked");
    const lp=eb(prog(t,0.72,0.96));
    lh.style.transform=`scale(${lerp(0.75,1,lp).toFixed(3)})`;
  }else{
    lh.classList.remove("liked");
    lh.style.transform="scale(1)";
  }
  const fp=prog(t,0.72,1.45);
  FHEARTS.forEach((h,i)=>{
    const p=clamp((fp-i*0.06)/0.65);
    h.el.style.opacity=p>0&&p<1?Math.sin(Math.PI*p)*0.95:0;
    h.el.style.transform=`translate3d(${(h.dx*p).toFixed(1)}px,${(-h.sp*p*U).toFixed(1)}px,0) scale(${h.sc})`;
  });
}
function s4(t){
  const g=$("#grid");
  const p1=eq(prog(t,.3,.75)),p2=eio(prog(t,.75,1.2));
  const cx=lerp(12,84,p1),cy=36,s=lerp(1.1,1.5,p1)+p2*.5;
  g.style.transform=`translate3d(${W/2-cx*U*s}px,${H/2-cy*U*s}px,0) scale(${s})`;
  g.style.opacity=1-prog(t,.95,1.2);
  const blur=2.6*Math.sin(Math.PI*prog(t,.3,.8));
  $("#cells").style.filter=blur>.3?`blur(${blur.toFixed(1)}px)`:"none";
  calCells.forEach(c=>{c.el.style.opacity=clamp((t-.05-c.dist*.035)/.2);});
  if(todayEl){
    const pop=eb(prog(t,.55,.85));
    todayEl.style.transform=`scale(${pop})`;todayEl.style.opacity=pop>0?1:0;
  }
}
function s5(t,T){
  const card=$("#card");
  $("#wash").style.opacity=prog(T,4.3,4.55)*(1-prog(T,5.3,5.5));
  card.style.backgroundColor=`rgba(255,255,255,${prog(T,4.35,4.55)})`;
  card.style.overflow=T<4.6?"visible":"hidden";
  const p=prog(T,3.95,4.6),e=eb(p);
  const pers=$("#pers"),bl=lerp(4,0,p);
  pers.style.transform=`translate3d(${((1-e)*46+tiltX*-2.5)*U}px,${(-(1-e)*96+tiltY*-2.5)*U}px,0) rotate(${(1-e)*38}deg) scale(${lerp(.3,1,e)})`;
  pers.style.opacity=clamp(p*6);pers.style.filter=bl>.2?`blur(${bl}px)`:"none";
  const bp=eb(prog(T,4.45,4.9)),b=$("#burst");
  b.style.opacity=bp>0?1:0;b.style.transform=`translate(${(tiltX*2)*U}px,${(tiltY*2)*U}px) scale(${Math.max(bp,0)}) rotate(${T*12}deg)`;
  const st=$("#streak");st.style.width=eo(prog(T,4.3,4.6))*34*U+"px";st.style.opacity=1-prog(T,4.7,4.9);
  const sh=eio(prog(T,5.15,5.65)),z=eio(prog(T,5.8,6.2));
  let sc=lerp(1,.62,sh);if(T>5.8)sc=lerp(.62,3,z);
  card.style.transform=`translate(${(tiltX*3)*U}px,${(tiltY*3)*U}px) scale(${sc})`;
  card.style.borderRadius=lerp(0,6*U,sh)+"px";
  card.style.boxShadow=`0 ${2*U}px ${6*U}px rgba(0,0,0,${.22*sh*(1-z)})`;
  card.style.opacity=1-prog(T,5.95,6.25);
  card.style.filter=z>.05?`blur(${(z*6).toFixed(1)}px)`:"none";
  $("#badge").style.opacity=prog(T,5.5,5.7);

  const cw=$("#capWrap");
  cw.style.opacity=prog(T,5.5,5.72)*(1-prog(T,5.8,5.95));
  cw.style.transform=`translateY(${(1-prog(T,5.5,5.72))*U}px)`;
  const lvls=[bassLevel,midLevel,highLevel,midLevel,bassLevel,highLevel];
  document.querySelectorAll(".eq i").forEach((bar,idx)=>{
    const h=22+lvls[idx%lvls.length]*78;
    bar.style.height=clamp(h,20,100).toFixed(0)+"%";
  });
}
function s6(t,T){
  $("#bk").style.transform=`scale(${1.06+(T-5)*.035}) translate(${Math.sin(T*.8)*1.2+tiltX*4.5}%,${Math.cos(T*.7)*1+tiltY*4.5}%)`;
  SPARKS.forEach(s=>{
    const dy=-((t*s.sp*18)%40);
    const op=0.35+0.55*Math.sin(T*3.2+s.ph);
    s.el.style.transform=`translate3d(${(Math.sin(T*1.5+s.ph)*2+tiltX*6)*U}px,${(dy+tiltY*6)*U}px,0)`;
    s.el.style.opacity=clamp(op,0,0.9);
  });
  let wordPtr=0;
  BLOCKS.forEach(bl=>{
    const out=prog(T,bl.b,bl.b+.3);
    bl.el.style.opacity=(T>=bl.a&&T<bl.b+.3)?1:0;
    bl.el.style.transform=`translate3d(${(tiltX*-2.5)*U}px,${(-out+tiltY*-2)*U}px,0)`;
    const count=bl.words.length;
    const span=(bl.b-bl.a-0.12)/Math.max(1,count);
    bl.words.forEach((w,i)=>{
      const item=ALL_WORDS[wordPtr++];
      if(item) item.rip=Math.max(0,item.rip-0.06);
      const rip=item?item.rip:0;

      const wStart=bl.a+i*span;
      const p=eo(prog(T,wStart,wStart+.32));
      /* Active Word Karaoke Spotlight: menyala terang tepat saat dinyanyikan */
      const active=Math.sin(Math.PI*clamp((T-wStart)/(span*1.45)));
      const bassLift=active>0?active*bassLevel*0.14:0;
      const sc=1+active*0.09+bassLift+rip*0.24;
      const dimOp=T>(wStart+span*1.35)?0.72:1;

      const bl2=(1-p)*8+out*10;
      w.style.opacity=p*(1-out)*dimOp;
      w.style.transform=`translate3d(0,${((1-p)*1.6-active*0.45-rip*0.8)*U}px,0) scale(${sc.toFixed(3)})`;
      w.style.color=(active>0.35||rip>0.2)?"#fff5d6":"#ffffff";
      w.style.textShadow=`0 0 ${(1.8+active*3.2+rip*4)*U}px rgba(255,190,65,${(0.32+active*0.62+rip*0.4).toFixed(2)})`;
      w.style.filter=bl2>.2?`blur(${bl2.toFixed(1)}px)`:"none";
    });
  });
  const sw=prog(T,8.4,8.8),sE=$("#sweep");
  sE.style.opacity=sw>0&&sw<1?1:0;sE.style.transform=`translateX(${lerp(-100,100,eio(sw))}%)`;
  const bp=eo(prog(T,8.8,9.15)),big=$("#bigw");
  const bigPulse=1+bassLevel*0.06+prog(T,9.15,9.4)*.1;
  big.style.opacity=bp;
  big.style.transform=`translate(${(tiltX*-3)*U}px,${(tiltY*-2)*U}px) scale(${(lerp(1.38,1,bp)*bigPulse).toFixed(3)})`;
  big.style.filter=bp<1?`blur(${((1-bp)*10).toFixed(1)}px) drop-shadow(0 ${1.2*U}px ${3.5*U}px rgba(160,70,5,.42))`:"";
}
function s7(t,T){
  const z=eio(prog(T,10.22,10.85));
  [["#ph0",-21,4,-9,0,18],["#ph2",21,6,9,.1,-18],["#ph1",0,0,0,.2,0]].forEach(([id,x,y,r,d,ry],i)=>{
    const p=eb(prog(T,9.3+d,9.3+d+.48)),el=$(id);
    const curRy=ry*(1-z*0.7)+tiltX*12;
    const curRx=-tiltY*10;
    el.style.transform=`translate3d(${(x+tiltX*2.5)*U}px,${(y+(1-p)*80+tiltY*2.5)*U}px,0) rotateX(${curRx.toFixed(1)}deg) rotateY(${curRy.toFixed(1)}deg) rotate(${r*(0.4+.6*p)}deg) scale(${i===2?1.08:1})`;
    el.style.opacity=clamp(p*4);
  });
  $("#zoomer").style.transform=`scale(${lerp(1.45,3.1,z)})`;
  /* Stamp Impact & Shake pada stiker merah */
  LAB.forEach(l=>{
    const raw=prog(T,l.a,l.a+.22);
    const p=eb(raw);
    const vis=(T>=l.a&&T<l.b)?1:0;
    const impact=raw>0.65 && raw<1 ? Math.sin((raw-0.65)*35)*3*(1-raw) : 0;
    const sc=lerp(1.32,1,p);
    l.el.style.fontSize=l.fs*U+"px";
    l.el.style.left=l.x*U+"px";l.el.style.top=`calc(50% + ${l.y*U}px)`;
    l.el.style.opacity=vis;
    l.el.style.transform=`rotate(${(l.rot+impact).toFixed(2)}deg) scale(${Math.max(sc,0).toFixed(3)})`;
  });
  $("#wo").style.opacity=prog(T,10.75,11.0);
}
function s8(t){
  const p=prog(t,0,.5),f=$("#fall");
  f.style.transform=`translate3d(${p*5*U}px,${(eo(p)*36)*U}px,0) rotate(${20+p*280}deg) scale(${lerp(1,.6,p)})`;
  f.style.opacity=1-prog(t,.32,.52);f.style.filter=`blur(${(p*4).toFixed(1)}px)`;
}
function s9(t){
  const a=eo(prog(t,.08,.48)),tx=$("#tx9");
  tx.style.transform=`translate3d(${((1-a)*60+tiltX*-2)*U}px,${(tiltY*-2)*U}px,0)`;tx.style.opacity=a;tx.style.filter=a<1?`blur(${((1-a)*8).toFixed(1)}px)`:"none";
  $("#pp9").style.transform=`translate(${(tiltX*2)*U}px,${(tiltY*2)*U}px) scale(${1+t*.05})`;
  const k=Math.floor(t*18);
  $("#gr9").style.transform=`translate(${(rnd(k)-.5)*2*U}px,${(rnd(k+3)-.5)*2*U}px)`;
}
function s10(t,T){
  $("#pp10").style.transform=`translate(${(tiltX*2)*U}px,${(tiltY*2)*U}px) scale(${1+t*.06})`;
  const k=Math.floor(t*18);
  $("#gr10").style.transform=`translate(${(rnd(k)-.5)*2*U}px,${(rnd(k+5)-.5)*2*U}px)`;
  const bl=Math.sin(Math.PI*prog(T,12.15,12.75));
  $("#bloom10").style.opacity=(bl*0.65).toFixed(2);
  const f=$("#fin"),fp=eo(prog(T,12.15,12.35))*(1-prog(T,12.65,12.85));
  f.style.opacity=fp;f.style.transform=`rotate(-3deg) translateY(${(1-eo(prog(T,12.15,12.35)))*6*U}px)`;
  /* Stamp Impact pada "DOUGH" */
  const rawB=prog(T,12.85,13.12);
  const bp=eb(rawB);
  const shakeB=rawB>0.6 && rawB<1 ? Math.sin((rawB-0.6)*40)*2.5*(1-rawB) : 0;
  const b=$("#finbig");
  b.style.opacity=clamp(rawB*4);
  b.style.transform=`rotate(${shakeB.toFixed(2)}deg) scale(${lerp(1.36,1,bp).toFixed(3)})`;
}
let glowX=0,glowY=22;
function s11(t,T){
  const e=$("#endUi"),p=prog(T,13.5,14.0);
  e.style.opacity=p;e.style.pointerEvents=p>.5?"auto":"none";
  const gx=glowX+tiltX*18,gy=glowY+tiltY*18;
  const sc=1+Math.sin(T*2.2)*0.08;
  $("#endGlow").style.transform=`translate3d(${gx*U}px,${gy*U}px,0) scale(${sc.toFixed(3)})`;
}

function moveEndGlow(e){
  if(!ended && T<13.15) return;
  const pt=e.touches?e.touches[0]:e;
  if(!pt) return;
  const r=stage.getBoundingClientRect();
  glowX=((pt.clientX-r.left)/r.width-0.5)*46;
  glowY=((pt.clientY-r.top)/r.height-0.5)*46;
  render(T);
}
stage.addEventListener("pointermove",moveEndGlow);
stage.addEventListener("touchmove",moveEndGlow,{passive:true});

/* ---------- daftar scene ---------- */
const SC=[
 {el:$("#s1"),a:0,b:1.55,fn:s1},
 {el:$("#s2"),a:1.5,b:2.05,fn:s2,fade:.05},
 {el:$("#s3"),a:2.0,b:3.55,fn:s3,fade:.08},
 {el:$("#s4"),a:3.4,b:4.7,fn:s4,fade:.15},
 {el:$("#s6"),a:5.0,b:9.45,fn:s6,fade:.5},
 {el:$("#s5"),a:3.9,b:6.3,fn:s5},
 {el:$("#s7"),a:9.25,b:11.05,fn:s7,fade:.2},
 {el:$("#s8"),a:10.85,b:11.4,fn:s8,fade:.12},
 {el:$("#s9"),a:11.25,b:12.0,fn:s9,fade:.15},
 {el:$("#s10"),a:11.85,b:13.4,fn:s10,fade:.15},
 {el:$("#s11"),a:13.15,b:999,fn:s11,fade:.35}
];
function render(T){
  updateBeatFX(T);
  for(const s of SC){
    const on=T>=s.a&&T<s.b;
    if(on!==s.on){s.on=on;s.el.style.display=on?"block":"none";}
    if(!on)continue;
    s.el.style.opacity=s.fade?clamp((T-s.a)/s.fade):1;
    s.fn(T-s.a,T);
  }
}

/* ---------- ukuran, audio & jam utama ---------- */
function fit(){W=stage.clientWidth;H=stage.clientHeight;U=W/100;document.documentElement.style.setProperty("--u",U+"px");render(T);}
let T=0,playing=true,ended=false,last=0;

const tapStart=$("#tapStart");
if(CFG.AUDIO) bgm.src=CFG.AUDIO;

function tryPlayAudio(){
  if(!CFG.AUDIO)return;
  bgm.play().then(()=>{
    initWebAudio();
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
    tapStart.style.display="none";
  }).catch(()=>{
    playing=false;
    tapStart.style.display="flex";
  });
}

tapStart.addEventListener("click",e=>{
  e.stopPropagation();
  enableGyro();
  tapStart.style.display="none";
  T=0;ended=false;playing=true;
  last=performance.now();
  if(CFG.AUDIO){
    initWebAudio();
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
    bgm.currentTime=0;
    bgm.play().catch(()=>{});
  }
  render(0);
});

function loop(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing&&!ended){
    if(CFG.AUDIO && !bgm.paused && bgm.readyState>=2 && Math.abs(bgm.currentTime-T)<0.5){
      T=bgm.currentTime;
    }else{
      T+=dt;
    }
    if(T>=END_TIME){
      T=END_TIME;ended=true;
      if(CFG.AUDIO) bgm.pause();
    }
    render(T);
  }
  requestAnimationFrame(loop);
}

const q=new URLSearchParams(location.search);
if(q.has("t")){T=parseFloat(q.get("t"))||0;playing=false;}
window.addEventListener("resize",fit);window.addEventListener("orientationchange",()=>setTimeout(fit,200));
fit();
if(playing) tryPlayAudio();
requestAnimationFrame(t=>{last=t;requestAnimationFrame(loop);});

/* ---------- GESTUR HP: HOLD-TO-PAUSE & TAP KIRI / TENGAH / KANAN ---------- */
let holdTimer=null,wasHeld=false,downTime=0;
function seekTo(nt){
  T=clamp(nt,0,END_TIME-0.05);
  ended=false;
  $("#pauseIcon").style.opacity=0;
  SC.forEach(s=>{s.on=null;});
  if(CFG.AUDIO){
    bgm.currentTime=T;
    if(playing && bgm.paused) bgm.play().catch(()=>{});
  }
  if(navigator.vibrate) try{navigator.vibrate(10);}catch(e){}
  render(T);
}
stage.addEventListener("pointerdown",e=>{
  if(e.target.closest("a,button,#tapStart"))return;
  if(!gyroActive) enableGyro();
  downTime=performance.now();
  wasHeld=false;
  clearTimeout(holdTimer);
  if(!ended){
    holdTimer=setTimeout(()=>{
      if(playing){
        wasHeld=true;
        playing=false;
        if(CFG.AUDIO) bgm.pause();
      }
    },190);
  }
});
stage.addEventListener("pointerup",e=>{
  clearTimeout(holdTimer);
  if(e.target.closest("a,button,#tapStart"))return;
  if(wasHeld){
    wasHeld=false;
    playing=true;
    $("#pauseIcon").style.opacity=0;
    last=performance.now();
    if(CFG.AUDIO){
      initWebAudio();
      if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
      bgm.currentTime=T;bgm.play().catch(()=>{});
    }
    return;
  }
  if(performance.now()-downTime<250){
    const r=stage.getBoundingClientRect();
    const rel=(e.clientX-r.left)/r.width;
    if(rel<0.28){
      seekTo(T-1.5);
    }else if(!ended && rel>0.72){
      seekTo(T+1.5);
    }else if(!ended){
      playing=!playing;
      const ic=$("#pauseIcon");ic.style.opacity=playing?0:1;
      if(CFG.AUDIO){
        if(playing){
          initWebAudio();
          if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
          bgm.currentTime=T;bgm.play().catch(()=>{});
        }else{
          bgm.pause();
        }
      }
    }
  }
});
stage.addEventListener("pointercancel",()=>{clearTimeout(holdTimer);});

document.addEventListener("visibilitychange",()=>{
  last=performance.now();
  if(document.hidden && CFG.AUDIO) bgm.pause();
  else if(!document.hidden && playing && !ended && CFG.AUDIO) bgm.play().catch(()=>{});
});
$("#replay").addEventListener("click",()=>{
  T=0;ended=false;playing=true;
  $("#pauseIcon").style.opacity=0;
  SC.forEach(s=>{s.on=null;});
  if(CFG.AUDIO){
    initWebAudio();
    if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
    bgm.currentTime=0;bgm.play().catch(()=>{});
  }
  render(0);
});
</script>
</body>
